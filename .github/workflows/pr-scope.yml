name: PR scope

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: Single plugin scope
    # pull_request_target 只读取文件清单，不检出或执行投稿者代码，因此可以
    # 安全地使用长期在线的组织 Runner。
    runs-on: [self-hosted, Linux, X64, PVE]
    steps:
      - name: Reject changes outside one plugin directory
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            const changedPaths = files.flatMap((file) =>
              [file.filename, file.previous_filename].filter(Boolean),
            );
            const pluginDirectories = new Set();
            let outsidePluginCount = 0;

            for (const changedPath of changedPaths) {
              const match = changedPath.match(/^plugins\/([^/]+)\/.+$/);
              if (match) pluginDirectories.add(match[1]);
              else outsidePluginCount += 1;
            }

            if (changedPaths.length === 0) {
              core.setFailed('The PR does not contain any changed files.');
              return;
            }
            if (pluginDirectories.size > 1) {
              core.setFailed(`A PR may modify at most one plugins/<plugin>/ directory; found ${pluginDirectories.size}.`);
              return;
            }
            if (pluginDirectories.size === 1) {
              if (outsidePluginCount > 0) {
                core.setFailed('Plugin PRs may not modify files outside their single plugins/<plugin>/ directory.');
                return;
              }
              core.info(`Accepted plugin directory: ${[...pluginDirectories].join(', ')}`);
              return;
            }

            if (
              pullRequest.head.repo.full_name !== context.payload.repository.full_name
              || !pullRequest.head.ref.startsWith('maintenance/')
            ) {
              core.setFailed('Repository infrastructure changes require an in-repository maintenance/* branch.');
              return;
            }
            core.info(`Accepted maintainer infrastructure PR: ${pullRequest.head.ref}`);
