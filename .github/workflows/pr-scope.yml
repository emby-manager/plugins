name: PR scope

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: Single plugin scope
    runs-on: ubuntu-latest
    steps:
      - name: Reject changes outside one plugin directory
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          declare -A plugin_directories=()
          changed_count=0

          while IFS= read -r changed_path; do
            [[ -n "$changed_path" ]] || continue
            changed_count=$((changed_count + 1))
            if [[ "$changed_path" =~ ^plugins/([^/]+)/.+$ ]]; then
              plugin_directories["${BASH_REMATCH[1]}"]=1
            else
              echo "::error file=$changed_path::Plugin PRs may only modify files below one plugins/<plugin>/ directory."
              exit 1
            fi
          done < <(
            gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[] | .filename, (.previous_filename // empty)'
          )

          if (( changed_count == 0 )); then
            echo "::error::The PR does not contain any changed files."
            exit 1
          fi
          if (( ${#plugin_directories[@]} != 1 )); then
            echo "::error::A PR must modify exactly one plugins/<plugin>/ directory; found ${#plugin_directories[@]}."
            exit 1
          fi

          echo "Accepted plugin directory: ${!plugin_directories[*]}"
