name: PR scope

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: Single plugin scope
    runs-on: ubuntu-latest
    steps:
      - name: Reject changes outside one plugin directory
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mapfile -t changed_paths < <(
            gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[] | .filename, (.previous_filename // empty)'
          )

          if [[ "$PR_AUTHOR" == "github-actions[bot]" && "$PR_HEAD" == catalog-release/* ]]; then
            for changed_path in "${changed_paths[@]}"; do
              [[ "$changed_path" == "catalog/index.json" || "$changed_path" == "catalog/signature.json" ]] || {
                echo "::error file=$changed_path::The release bot may only update the signed catalog pair."
                exit 1
              }
            done
            (( ${#changed_paths[@]} > 0 )) || {
              echo "::error::The catalog release PR does not contain any changed files."
              exit 1
            }
            echo "Accepted signed catalog update from the official release workflow."
            exit 0
          fi

          declare -A plugin_directories=()
          changed_count=0

          for changed_path in "${changed_paths[@]}"; do
            [[ -n "$changed_path" ]] || continue
            changed_count=$((changed_count + 1))
            if [[ "$changed_path" =~ ^plugins/([^/]+)/.+$ ]]; then
              plugin_directories["${BASH_REMATCH[1]}"]=1
            else
              echo "::error file=$changed_path::Plugin PRs may only modify files below one plugins/<plugin>/ directory."
              exit 1
            fi
          done

          if (( changed_count == 0 )); then
            echo "::error::The PR does not contain any changed files."
            exit 1
          fi
          if (( ${#plugin_directories[@]} != 1 )); then
            echo "::error::A PR must modify exactly one plugins/<plugin>/ directory; found ${#plugin_directories[@]}."
            exit 1
          fi

          echo "Accepted plugin directory: ${!plugin_directories[*]}"
