name: PR scope

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    name: Single plugin scope
    runs-on: ubuntu-latest
    steps:
      - name: Reject changes outside one plugin directory
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mapfile -t changed_paths < <(
            gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[] | .filename, (.previous_filename // empty)'
          )

          declare -A plugin_directories=()
          changed_count=0
          outside_plugin_count=0

          for changed_path in "${changed_paths[@]}"; do
            [[ -n "$changed_path" ]] || continue
            changed_count=$((changed_count + 1))
            if [[ "$changed_path" =~ ^plugins/([^/]+)/.+$ ]]; then
              plugin_directories["${BASH_REMATCH[1]}"]=1
            else
              outside_plugin_count=$((outside_plugin_count + 1))
            fi
          done

          if (( changed_count == 0 )); then
            echo "::error::The PR does not contain any changed files."
            exit 1
          fi
          if (( ${#plugin_directories[@]} > 1 )); then
            echo "::error::A PR may modify at most one plugins/<plugin>/ directory; found ${#plugin_directories[@]}."
            exit 1
          fi

          if (( ${#plugin_directories[@]} == 1 )); then
            if (( outside_plugin_count > 0 )); then
              echo "::error::Plugin PRs may not modify files outside their single plugins/<plugin>/ directory."
              exit 1
            fi
            echo "Accepted plugin directory: ${!plugin_directories[*]}"
            exit 0
          fi

          if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" || ! "$HEAD_BRANCH" =~ ^maintenance/ ]]; then
            echo "::error::Repository infrastructure changes require an in-repository maintenance/* branch."
            exit 1
          fi

          echo "Accepted maintainer infrastructure PR: $HEAD_BRANCH"
