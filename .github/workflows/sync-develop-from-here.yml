name: Sync develop-from-here

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-develop-from-here
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'emby-manager/plugins' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Fast-forward contributor base branch
        run: git push origin HEAD:refs/heads/develop-from-here
