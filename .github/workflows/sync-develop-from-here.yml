name: Sync develop-from-here

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-develop-from-here
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'emby-manager/plugins' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fast-forward contributor base branch
        run: git push origin HEAD:refs/heads/develop-from-here
