name: Sign and publish plugin

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Directory name below plugins/
        required: true

permissions:
  contents: write
  statuses: write

concurrency:
  group: plugin-catalog-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'emby-manager/plugins' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: plugin-signing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.10.0
          cache: npm
      - name: Validate release target
        env:
          PLUGIN_DIR: ${{ inputs.plugin }}
        run: |
          if [[ ! "$PLUGIN_DIR" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || [[ ! -f "plugins/$PLUGIN_DIR/plugin.json" ]]; then
            echo "Invalid plugin directory: $PLUGIN_DIR" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run validate
      - name: Build signed package
        env:
          EM_PLUGIN_SIGNING_KEY: ${{ secrets.EM_PLUGIN_SIGNING_KEY }}
          EM_PLUGIN_SIGNING_KEY_ID: ${{ vars.EM_PLUGIN_SIGNING_KEY_ID }}
          EM_PLUGIN_PUBLISHER: Emby Manager
          PLUGIN_DIR: ${{ inputs.plugin }}
        run: node packages/cli/dist/index.js build "plugins/$PLUGIN_DIR" dist
      - name: Read release metadata
        id: metadata
        env:
          PLUGIN_DIR: ${{ inputs.plugin }}
        run: node -e "const fs=require('fs');const p=require('./plugins/'+process.env.PLUGIN_DIR+'/plugin.json');fs.appendFileSync(process.env.GITHUB_OUTPUT,'tag='+p.id+'-v'+p.version+'\\nfilename='+p.id+'-'+p.version+'.emp\\n')"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          PACKAGE_FILE: dist/${{ steps.metadata.outputs.filename }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE_FILE" --clobber
          else
            gh release create "$TAG" "$PACKAGE_FILE" --title "$TAG" --generate-notes
          fi
      - name: Update and sign catalog
        env:
          EM_PLUGIN_SIGNING_KEY: ${{ secrets.EM_PLUGIN_SIGNING_KEY }}
          EM_PLUGIN_SIGNING_KEY_ID: ${{ vars.EM_PLUGIN_SIGNING_KEY_ID }}
          DOWNLOAD_URL: https://github.com/emby-manager/plugins/releases/download/${{ steps.metadata.outputs.tag }}/${{ steps.metadata.outputs.filename }}
        run: |
          node packages/cli/dist/index.js catalog-add "dist/${{ steps.metadata.outputs.filename }}" "$DOWNLOAD_URL"
          node packages/cli/dist/index.js catalog-sign
          node packages/cli/dist/index.js catalog-verify
      - name: Publish signed catalog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/index.json catalog/signature.json
          mapfile -t staged_files < <(git diff --cached --name-only | sort)
          if (( ${#staged_files[@]} != 2 )) \
            || [[ "${staged_files[0]}" != "catalog/index.json" ]] \
            || [[ "${staged_files[1]}" != "catalog/signature.json" ]]; then
            printf 'Refusing catalog release with unexpected staged files:\n%s\n' "${staged_files[*]}" >&2
            exit 1
          fi
          git commit -m "chore(catalog): publish ${{ steps.metadata.outputs.tag }}"
          release_branch="catalog-release/$TAG-$GITHUB_RUN_ID"
          git switch -c "$release_branch"
          git push -u origin "$release_branch"
          commit_sha=$(git rev-parse HEAD)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$commit_sha" \
            -f state=success -f context='Single plugin scope' \
            -f description='Only the signed catalog pair is staged' -f target_url="$run_url" >/dev/null
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$commit_sha" \
            -f state=success -f context='validate' \
            -f description='Official package and catalog validation passed' -f target_url="$run_url" >/dev/null
          git fetch origin main
          if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]]; then
            echo 'main advanced during signing; retry the release against the new head' >&2
            exit 1
          fi
          git push origin HEAD:main
          git push origin HEAD:develop-from-here
          git push origin --delete "$release_branch"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-plugin-package
          path: dist/*.emp
          if-no-files-found: error
